name: ProductAPI CI

on:
  push:
    branches:
      - main
      - feature/hanna
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Mango.Services.ProductAPI.csproj

      - name: Build
        run: dotnet build Mango.Services.ProductAPI.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Set up Docker Buildx for layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image using GitHub Actions layer cache
      - name: Build Docker image
        run: |
          docker buildx build \
            -t mango-productapi:latest \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # GHCR uses the lowercase organization name for container image paths.
          docker tag mango-productapi:latest ghcr.io/mdkasims-ccg/mango-productapi:latest
          docker push ghcr.io/mdkasims-ccg/mango-productapi:latest
