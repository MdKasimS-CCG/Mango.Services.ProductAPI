name: ProductAPI CI

on:
  push:
    branches:
      - main
      - feature/hanna
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Mango.Services.ProductAPI.csproj

      - name: Build
        run: dotnet build Mango.Services.ProductAPI.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Build Docker image
        run: |
          docker build \
            -t mango-productapi:latest .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag mango-productapi:latest ghcr.io/mdkasims-ccg/mango-productapi:latest
          docker push ghcr.io/mdkasims-ccg/mango-productapi:latest
